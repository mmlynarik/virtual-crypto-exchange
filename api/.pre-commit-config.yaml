# pre-commit runs hooks from the git root (the repo root), so paths here are relative to it.
# Install with: pre-commit install --config api/.pre-commit-config.yaml
files: ^api/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix, --config=api/pyproject.toml]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        args: [--config=api/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [--config-file=api/pyproject.toml]
        # mypy runs in its own env, so it needs the project's typed dependencies to check against them
        additional_dependencies: [alembic, fastapi, httpx, pydantic, pyjwt, "sqlalchemy[asyncio]"]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort (python)
        args: [--settings-path=api/pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
