[project]
name = "vce"
version = "0.1.0"
description = "Virtual Crypto Exchange API"
readme = "README.md"
requires-python = ">=3.14.0"

dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi[standard]==0.115.12",
    "httpx==0.28.1",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.0.40",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "isort==9.0.2",
    "mypy==2.4.1",
    "pre-commit==4.2.0",
    "pytest==8.3.5",
    "ruff==0.17.6",
]

[project.scripts]
vce = "vce:main"
vce-migrate = "vce.scripts.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
exclude = ["experimental/", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["vce"]

[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["vce"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
strict_equality = false
exclude = ["^notebooks/", "migrations/"]
