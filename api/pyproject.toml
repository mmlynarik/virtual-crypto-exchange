[project]
name = "VCE"
version = "0.1.0"
description = "Virtual Crypto Exchange project"
readme = "README.md"
authors = [
    { name = "Miroslav Mlynarik", email = "miroslav.mlynarik@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.8",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0.38",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "ruff>=0.9.7",
]

[project.scripts]
vce = "vce:main"
vce-migrate = "vce.scripts.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vce"]

[tool.ruff]
line-length = 110
exclude = ["experimental/", ".venv"]

[tool.ruff.lint.isort]
known-first-party = ["vce"]

[tool.black]
line-length = 110

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["vce"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
strict_equality = false
exclude = ["^notebooks/", "migrations/"]
