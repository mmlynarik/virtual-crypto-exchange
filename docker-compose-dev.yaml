services:
  db:
    restart: always
    image: postgres:15
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5433:5432
    volumes:
      - dev_db:/var/lib/postgresql/data
    networks:
      - caddy

  api:
    build:
      context: ./api
      target: dev
    container_name: api
    environment:
      - BACKEND_DB_USER=postgres
      - BACKEND_DB_PASSWORD=postgres
      - BACKEND_DB_HOST=db
      - BACKEND_DB_NAME=postgres
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set it in .env.dev}
      - GITHUB_CLIENT_ID=Ov23li7Fta3hsirrob9c
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:?set it in .env.dev}
    ports:
      - 8000:8000
    depends_on:
      - db
    restart: always
    volumes:
      - ./api/vce:/app/vce
    networks:
      - caddy

  web:
    build:
      context: ./web
    container_name: web
    environment:
      - BACKEND_API_URL=http://api:8000/api
      - GITHUB_CLIENT_ID=Ov23li7Fta3hsirrob9c
      - GITHUB_REDIRECT_URL=http://localhost:3000/api/oauth/github
    ports:
      - 3000:3000
    depends_on:
      - db
      - api
    restart: always
    networks:
      - caddy

volumes:
  dev_db:

networks:
  caddy:
