# .github/workflows/build-web.yml
name: Build & Push WEB
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/build-web.yml"
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: miromlynarik
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: miromlynarik/vce-web:prod
          cache-from: type=gha,scope=vce-web
          cache-to: type=gha,scope=vce-web,mode=max
